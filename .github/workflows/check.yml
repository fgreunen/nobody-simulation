name: Verify

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            verification-results/
            playwright-report/
            test-results/
          retention-days: 14
